apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: pushgateway
  name: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: pushgateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: pushgateway
      annotations:
        diun.enable: "true"
        diun.watch_repo: "true"
        diun.sort_tags: "semver"
        diun.max_tags: "2"
        diun.include_tags: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - image: prom/pushgateway:v1.11.5
          name: pushgateway
          args:
            - "--persistence.file=/data/metrics"
          ports:
            - containerPort: 9091
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: pushgateway-data
      restartPolicy: Always
      volumes:
        - name: pushgateway-data
          persistentVolumeClaim:
            claimName: pushgateway-data-lh
