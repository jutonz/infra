---
- name: Add k3s
  hosts: all
  become: true
  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
  tasks:
    - name: Install cron job to prune old images
      ansible.builtin.cron:
        name: "Prune k3s images"
        user: root
        minute: "0"
        hour: "2"
        job: "/usr/local/bin/k3s crictl rmi --prune"

    # Every container runs as root, so all pods on a node share root's
    # inotify instance limit. The kernel default of 128 runs out.
    - name: Raise inotify instance limit
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-inotify.conf
        content: "fs.inotify.max_user_instances=1024\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload sysctl
